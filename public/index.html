<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Neon Enterprise Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div id="authBox" class="card center">
  <h1 class="neon">NEON LOGIN</h1>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none;">

  <div class="topbar neon">
    🚀 NEON ENTERPRISE DASHBOARD
  </div>

  <div class="grid">

    <div class="card">
      <h3>IP USER</h3>
      <p id="ip">Loading...</p>
    </div>

    <div class="card">
      <h3>ANALYTICS</h3>
      <p>User: <span id="totalUser">0</span></p>
      <p>Order: <span id="totalOrder">0</span></p>
      <p>Chat: <span id="totalChat">0</span></p>
    </div>

    <div class="card">
      <h3>ANTI PHISHING CHECK</h3>
      <input id="urlCheck" placeholder="https://example.com">
      <button onclick="checkPhishing()">Check</button>
      <p id="phishResult"></p>
    </div>

    <div class="card">
      <h3>FORM ORDER</h3>

      <select id="orderType">
        <option>PINJAMAN ONLINE</option>
        <option>PRODUK DIGITAL</option>
        <option>RENTAL KENDARAAN</option>
      </select>

      <input id="orderName" placeholder="Nama">
      <button onclick="createOrder()">Kirim Order</button>
    </div>

    <div class="card">
      <h3>LIVE CHAT</h3>
      <input id="chatMsg" placeholder="Chat...">
      <button onclick="sendChat()">Kirim</button>
      <div id="chatBox"></div>
    </div>

    <div class="card">
      <h3>GRAFIK SAHAM (SIMULASI REALTIME)</h3>
      <canvas id="chart"></canvas>
    </div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
